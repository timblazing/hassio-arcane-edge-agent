configuration:
  manager_api_url:
    name: Manager API URL
    description: >-
      The address of your Arcane manager, as reachable from this machine.
      For example http://10.1.1.4:3552
  agent_token:
    name: Agent token
    description: >-
      The arc_... token from Arcane (Agents > Add Agent). An enrollment
      token (arc_etkn_...) or an existing agent's token both work.
  agent_transport:
    name: Transport
    description: >-
      How the agent connects to the manager. It always dials out, so it works
      behind NAT and firewalls. auto uses gRPC and falls back to WebSocket;
      choose websocket if a reverse proxy in front of the manager does not
      pass HTTP/2, or if the manager URL has a path prefix.
  log_level:
    name: Log level
    description: >-
      How much detail to write to the log. Use debug when
      troubleshooting a connection problem.
  analytics:
    name: Send usage analytics
    description: >-
      Let the agent send anonymous usage data to the Arcane project. Off by
      default; leaving it off also keeps rate-limit warnings out of the log.
