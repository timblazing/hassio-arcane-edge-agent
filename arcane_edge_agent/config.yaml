# https://contributors.home-assistant.io/apps/reference/configuration/
name: Arcane Agent
version: "3.0.1.1"
slug: arcane_edge_agent
description: >-
  Manage this machine's Docker containers from an Arcane manager
url: https://github.com/timblazing/hassio-arcane-edge-agent
image: ghcr.io/timblazing/hassio-arcane-edge-agent-{arch}
arch:
  - aarch64
  - amd64
init: false
# The agent manages this host's containers, so it needs the Docker API.
# Home Assistant only grants it when Protection mode is off.
docker_api: true
options:
  manager_api_url: ""
  agent_token: ""
  agent_transport: auto
  log_level: info
  analytics: false
schema:
  manager_api_url: url?
  agent_token: password?
  agent_transport: list(auto|grpc|websocket)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  analytics: bool
