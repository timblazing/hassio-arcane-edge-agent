name: Build add-on

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Read add-on information
    outputs:
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./arcane_edge_agent"

  build:
    needs: prepare
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: ubuntu-24.04-arm
          - arch: amd64
            os: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Image names match config.yaml's image (ghcr.io/<owner>/hassio-arcane-edge-agent-{arch}),
      # so existing installs keep pulling from the same, already public packages.
      # Pull requests build without pushing; only commits on main publish.
      - name: Build add-on image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./arcane_edge_agent"
          image: ghcr.io/${{ github.repository_owner }}/hassio-arcane-edge-agent-${{ matrix.arch }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=https://github.com/${{ github.repository }}
          push: ${{ github.event_name != 'pull_request' }}
          version: ${{ needs.prepare.outputs.version }}
