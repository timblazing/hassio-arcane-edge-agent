name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-addon:
    runs-on: ubuntu-latest
    name: Lint add-on config
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./arcane_edge_agent"

  lint-hadolint:
    runs-on: ubuntu-latest
    name: Lint Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ./arcane_edge_agent/Dockerfile

  lint-shellcheck:
    runs-on: ubuntu-latest
    name: Lint shell scripts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The s6 scripts' shebang is /command/with-contenv bashio, which
      # shellcheck does not recognise (SC1008); each file declares
      # "shellcheck shell=bash" instead.
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -s bash -e SC1008 \
            arcane_edge_agent/rootfs/etc/s6-overlay/s6-rc.d/arcane-agent/run \
            arcane_edge_agent/rootfs/etc/s6-overlay/s6-rc.d/arcane-agent/finish \
            scripts/*.sh
