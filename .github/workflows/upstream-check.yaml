name: Publish new Arcane agent releases

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: arcane-upstream-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find a newer stable release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^  ARCANE_VERSION: "\(.*\)"$/\1/p' arcane_edge_agent/build.yaml)"
          latest="$(gh release view --repo getarcaneapp/arcane --json tagName --jq '.tagName' | sed 's/^v//')"

          if [[ ! "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Arcane version: pinned=$pinned latest=$latest" >&2
            exit 1
          fi

          echo "Pinned: $pinned"
          echo "Latest stable release: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [[ "$latest" == "$pinned" ]]; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          elif [[ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n 1)" == "$latest" ]]; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest upstream release is older than the bundled agent; skipping."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump and publish the add-on version
        if: steps.check.outputs.outdated == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          ./scripts/bump-version.sh "$LATEST"

          python3 - "$LATEST" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          path = Path("arcane_edge_agent/CHANGELOG.md")
          changelog = path.read_text()
          heading = "# Changelog\n\n"
          if not changelog.startswith(heading):
              raise SystemExit("Unexpected changelog format")
          entry = (
              f"## {version}\n\n"
              f"- Update the bundled Arcane agent to v{version}. "
              f"[Upstream release notes](https://github.com/getarcaneapp/arcane/releases/tag/v{version}).\n\n"
          )
          path.write_text(heading + entry + changelog[len(heading):])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcane_edge_agent/Dockerfile arcane_edge_agent/build.yaml arcane_edge_agent/config.yaml arcane_edge_agent/CHANGELOG.md
          git commit -m "Update Arcane agent to v${LATEST}"
          git push origin HEAD:main

      # Commits made with GITHUB_TOKEN do not trigger push workflows. Explicitly
      # dispatch the existing validation and image publishing workflows.
      - name: Run validation and image publishing
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run lint.yaml --ref main
          gh workflow run builder.yaml --ref main
